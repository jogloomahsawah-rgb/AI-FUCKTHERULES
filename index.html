<!DOCTYPE html>

<body>

<!-- HUD -->
<div id="hud" hidden>
  <div class="hud-top">

    <button class="hb" id="bCatalog">KATALOG</button>
    <button class="hb" id="bKasir">KASIR ▸</button>
    <span class="grow"></span>
    <button class="hb" id="bPhone" aria-label="Buka HP AI">📱</button>
    <button class="hb" id="bView" aria-label="Ganti sudut pandang">TPV</button>
    <button class="hb" id="bMute" aria-label="Suara">🔊</button>
    <button class="hb" id="bCart">TAS <b id="cartN">0</b></button>
  </div>
  <div id="prompt" hidden></div>
  <div id="toast" hidden></div>
  <div id="touch">
    <div id="joy"><div id="knob"></div></div>
    <button id="bAct">E</button>
  </div>
</div>

<!-- INTRO -->
<section id="intro" class="screen">

    <img class="brand-logo" src="logo.png" alt="Logo FvcktheRules" width="132" height="190">

    <div class="btns">
      <button class="btn pri" id="bPlay">PLAY</button>

      <button class="btn" id="bHow">HOW TO PLAY</button>
      
    </div>
    <div class="load" id="loadState"><i></i><span>Memuat katalog…</span></div>
    <div class="born">born to disobey</div>
  </div>
</section>

<!-- PANEL (katalog / produk / tas / checkout / kasir) -->
<div id="panel" class="screen" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-bar">
      <button class="x" id="pBack" hidden>‹ KEMBALI</button>
      <img class="sb-logo" src="logo.png" alt=""><span id="pTitle"></span>
      <button class="x" id="pClose" aria-label="Tutup">✕</button>
    </div>
    <div id="pBody" class="sheet-body"></div>
  </div>
</div>
